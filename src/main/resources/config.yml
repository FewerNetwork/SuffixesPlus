database:
  username: USERNAME
  password: PASSWORD
  url: jdbc:mysql://HOST:PORT/NAME

suffix:
  # A list of different ways of hiding the suffix if the user doesn't own it.
  # Permission to give the suffix: suffixsplus.type.<type>
  # <type> will be the exact same as in the list bellow
  hide:
    - custom
  # If notifications is set to true people can turn off notifications!
  notification: true
  prefix: "suffix_"
  link: "https://"
  # %suffix% will be replaced with the suffix name
  purchaseMessage:
    - ""
    - "<aqua>Click here to purchase the '%suffix%' suffix!"
    - ""
  purchaseHoverMessage: "<aqua>Click here to purchase the %suffix% suffix!"
  
player:
  rankPlaceholder: "%vault_prefix%"